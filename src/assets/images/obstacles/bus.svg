<svg width="90" height="120" xmlns="http://www.w3.org/2000/svg">
  <!-- Bus body -->
  <rect x="10" y="20" width="70" height="80" rx="8" fill="#4169E1" stroke="#000" stroke-width="3"/>
  <!-- Roof -->
  <rect x="15" y="10" width="60" height="15" rx="5" fill="#1E3A8A" stroke="#000" stroke-width="2"/>
  <!-- Wheels -->
  <circle cx="25" cy="105" r="8" fill="#222" stroke="#000" stroke-width="2"/>
  <circle cx="65" cy="105" r="8" fill="#222" stroke="#000" stroke-width="2"/>
  <!-- Windows (rows) -->
  <rect x="15" y="30" width="60" height="15" rx="3" fill="#87CEEB"/>
  <rect x="15" y="50" width="60" height="15" rx="3" fill="#87CEEB"/>
  <rect x="15" y="70" width="60" height="15" rx="3" fill="#87CEEB"/>
  <!-- Door -->
  <rect x="65" y="70" width="10" height="25" rx="2" fill="#333"/>
</svg>
