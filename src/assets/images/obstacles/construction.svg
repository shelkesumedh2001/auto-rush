<svg width="100" height="80" xmlns="http://www.w3.org/2000/svg">
  <!-- Construction barrier (striped) -->
  <rect x="5" y="20" width="90" height="40" fill="#FFA500" stroke="#000" stroke-width="3" rx="5"/>
  <!-- Black stripes -->
  <rect x="5" y="20" width="15" height="40" fill="#000"/>
  <rect x="30" y="20" width="15" height="40" fill="#000"/>
  <rect x="55" y="20" width="15" height="40" fill="#000"/>
  <rect x="80" y="20" width="15" height="40" fill="#000"/>
  <!-- Warning light on top -->
  <circle cx="50" cy="10" r="8" fill="#FF0000"/>
  <circle cx="50" cy="10" r="5" fill="#FFFF00" opacity="0.8"/>
  <!-- Support legs -->
  <rect x="10" y="60" width="8" height="18" fill="#8B4513"/>
  <rect x="82" y="60" width="8" height="18" fill="#8B4513"/>
</svg>
