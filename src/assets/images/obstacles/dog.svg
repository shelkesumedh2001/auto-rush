<svg width="60" height="50" xmlns="http://www.w3.org/2000/svg">
  <!-- Dog body -->
  <ellipse cx="35" cy="30" rx="20" ry="15" fill="#8B4513" stroke="#654321" stroke-width="2"/>
  <!-- Head -->
  <circle cx="15" cy="25" r="12" fill="#8B4513" stroke="#654321" stroke-width="2"/>
  <!-- Ears -->
  <ellipse cx="10" cy="18" rx="5" ry="10" fill="#654321"/>
  <ellipse cx="20" cy="18" rx="5" ry="10" fill="#654321"/>
  <!-- Legs -->
  <rect x="20" y="40" width="5" height="8" fill="#654321"/>
  <rect x="30" y="40" width="5" height="8" fill="#654321"/>
  <rect x="40" y="40" width="5" height="8" fill="#654321"/>
  <rect x="50" y="40" width="5" height="8" fill="#654321"/>
  <!-- Tail -->
  <path d="M 55,28 Q 60,25 58,20" stroke="#654321" stroke-width="4" fill="none"/>
  <!-- Eyes -->
  <circle cx="12" cy="23" r="2" fill="#000"/>
  <circle cx="18" cy="23" r="2" fill="#000"/>
  <!-- Nose -->
  <circle cx="15" cy="28" r="2" fill="#000"/>
</svg>
