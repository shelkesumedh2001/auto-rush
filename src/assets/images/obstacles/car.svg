<svg width="70" height="70" xmlns="http://www.w3.org/2000/svg">
  <!-- Car body -->
  <rect x="10" y="25" width="50" height="30" rx="5" fill="#FF4444" stroke="#000" stroke-width="2"/>
  <!-- Roof -->
  <rect x="15" y="15" width="40" height="15" rx="5" fill="#CC0000" stroke="#000" stroke-width="2"/>
  <!-- Wheels -->
  <circle cx="20" cy="60" r="6" fill="#222"/>
  <circle cx="50" cy="60" r="6" fill="#222"/>
  <!-- Windows -->
  <rect x="18" y="18" width="15" height="10" rx="2" fill="#87CEEB"/>
  <rect x="37" y="18" width="15" height="10" rx="2" fill="#87CEEB"/>
  <!-- Headlights -->
  <circle cx="8" cy="35" r="2" fill="#FFFF00"/>
  <circle cx="8" cy="45" r="2" fill="#FFFF00"/>
</svg>
