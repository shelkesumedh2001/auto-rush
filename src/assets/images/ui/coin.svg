<svg width="30" height="30" xmlns="http://www.w3.org/2000/svg">
  <!-- Coin -->
  <circle cx="15" cy="15" r="14" fill="#FFD700" stroke="#FFA500" stroke-width="2"/>
  <!-- Inner circle -->
  <circle cx="15" cy="15" r="11" fill="#FFA500" opacity="0.6"/>
  <!-- Shine effect -->
  <ellipse cx="11" cy="11" rx="4" ry="3" fill="#FFFF00" opacity="0.8"/>
  <!-- Currency symbol or pattern -->
  <text x="15" y="20" font-size="14" fill="#FFF" font-weight="bold" text-anchor="middle">₹</text>
</svg>
