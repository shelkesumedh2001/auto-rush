<svg width="60" height="80" xmlns="http://www.w3.org/2000/svg">
  <!-- Auto-rickshaw yellow body -->
  <rect x="5" y="20" width="50" height="40" rx="8" fill="#FFD700" stroke="#000" stroke-width="2"/>
  <!-- Roof -->
  <path d="M 10,20 L 30,5 L 50,20 Z" fill="#FFA500" stroke="#000" stroke-width="2"/>
  <!-- Wheels -->
  <circle cx="15" cy="65" r="8" fill="#333" stroke="#000" stroke-width="2"/>
  <circle cx="45" cy="65" r="8" fill="#333" stroke="#000" stroke-width="2"/>
  <!-- Front wheel -->
  <circle cx="30" cy="70" r="6" fill="#333" stroke="#000" stroke-width="2"/>
  <!-- Windows -->
  <rect x="12" y="25" width="18" height="15" rx="3" fill="#87CEEB" stroke="#000" stroke-width="1"/>
  <rect x="32" y="25" width="18" height="15" rx="3" fill="#87CEEB" stroke="#000" stroke-width="1"/>
  <!-- Headlights -->
  <circle cx="10" cy="45" r="3" fill="#FFFF00"/>
  <circle cx="50" cy="45" r="3" fill="#FFFF00"/>
</svg>
