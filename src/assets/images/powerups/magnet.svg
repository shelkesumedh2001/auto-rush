<svg width="40" height="40" xmlns="http://www.w3.org/2000/svg">
  <!-- Magnet U-shape -->
  <path d="M 10,8 L 10,25 Q 10,32 20,32 Q 30,32 30,25 L 30,8"
        stroke="#DC143C" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- North pole (red) -->
  <rect x="6" y="6" width="8" height="12" rx="2" fill="#DC143C"/>
  <text x="8" y="15" font-size="10" fill="#FFF" font-weight="bold">N</text>
  <!-- South pole (blue) -->
  <rect x="26" y="6" width="8" height="12" rx="2" fill="#4169E1"/>
  <text x="28" y="15" font-size="10" fill="#FFF" font-weight="bold">S</text>
  <!-- Sparkles -->
  <circle cx="20" cy="35" r="2" fill="#FFD700"/>
  <circle cx="15" cy="30" r="1.5" fill="#FFD700"/>
  <circle cx="25" cy="30" r="1.5" fill="#FFD700"/>
</svg>
