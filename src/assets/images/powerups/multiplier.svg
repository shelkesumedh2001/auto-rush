<svg width="40" height="40" xmlns="http://www.w3.org/2000/svg">
  <!-- Circle background -->
  <circle cx="20" cy="20" r="18" fill="#9370DB" stroke="#663399" stroke-width="2"/>
  <!-- X symbol (multiply) -->
  <path d="M 10,10 L 30,30 M 30,10 L 10,30"
        stroke="#FFF" stroke-width="4" stroke-linecap="round"/>
  <!-- 2 number -->
  <text x="25" y="18" font-size="16" fill="#FFD700" font-weight="bold">2</text>
  <!-- Sparkle effect -->
  <circle cx="8" cy="8" r="2" fill="#FFD700"/>
  <circle cx="32" cy="8" r="2" fill="#FFD700"/>
  <circle cx="8" cy="32" r="2" fill="#FFD700"/>
  <circle cx="32" cy="32" r="2" fill="#FFD700"/>
</svg>
